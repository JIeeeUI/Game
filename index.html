<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>점 잇기 퍼즐 (Dot Connect)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="hud-info">
      <div>점수: <span id="target">0</span></div>
      <div>이동: <span id="moves">0</span></div>
      <div>최고: <span id="best">0</span></div>
    </div>
    <div style="display: flex; gap: 8px; align-items: center;">
      <div class="diff-group">
        <button class="diff-btn active" data-diff="easy">보통 (5x5)</button>
        <button class="diff-btn" data-diff="hard">어려움 (7x7)</button>
      </div>
      <button class="btn small" id="btnPause">일시정지</button>
      <button class="btn small" id="btnSound">소리: 꺼짐</button>
    </div>
  </div>

  <div id="game-area">
    <div id="grid-container"></div>
    <div id="banner"><span>🔀</span><span>재배치!</span></div>
    <div id="bonus-text">+ 보너스!</div>
    
    <div id="msg">
      <h1 id="msgTitle">점 잇기 퍼즐</h1>
      <p id="msgBody">
        같은 색 점을 3개 이상 <span class="highlight">누른 채 드래그</span>해서 연결하세요.<br>
        ※ 상하좌우로만 이동 가능 (대각선 X)<br>
        <span class="highlight">※ 실수했다면 왔던 길로 되돌아가세요. (취소)</span><br>
        <span style="color: #2a9d8f; font-weight: bold;">※ 기본 1점, 연결한 개수만큼 점수 추가!</span><br>
        <span style="color: #e63946; font-size: 13px;">[어려움 모드] 2초마다 점이 무작위로 사라집니다!</span>
      </p>
      
      <div id="pauseMenu" class="pause-menu hidden">
        <div style="font-size: 14px; text-align: left; background: #f8f9fa; padding: 10px; border-radius: 8px; width: 100%; color: #333; line-height: 1.6;">
          <div>조작: 점을 누른 채 드래그</div>
          <div>취소: 왔던 길로 되돌아가기</div>
          <div>완료: 손(마우스) 떼기</div>
          <div style="margin-top: 5px; border-top: 1px solid #ddd; padding-top: 5px;">일시정지 해제: ESC</div>
        </div>
        <button class="btn small" id="btnSoundPause" style="width: 100%; padding: 10px;">소리: 꺼짐</button>
        <div class="pause-controls">
          <button class="icon-btn" id="btnResume" title="재개">▶</button>
          <button class="icon-btn restart" id="btnRestart" title="재시작">↻</button>
        </div>
      </div>

      <button id="btnStart" class="action-btn">게임 시작</button>
    </div>
  </div>
  <div id="status"></div>
</div>
<script src="game.js"></script>
</body>
</html>
