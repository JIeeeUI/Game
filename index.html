<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌾 농장 지키기 - 두더지 잡기</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 게임 전체 컨테이너 -->
  <div id="game">
    <!-- 상단: 현재 상태 표시 -->
    <div id="hud">
      <span>🐹 잡은 수: <span id="caught">0</span>/20</span>
      <span>💥 피해: <span id="damage">0</span>/5</span>
      <span>🔥 콤보: <span id="combo">0</span></span>
      <span>⭐ 점수: <span id="score">0</span></span>
    </div>

    <!-- 3x3 밭 (구멍 9칸, JS로 채움) -->
    <div id="field"></div>

    <!-- 하단: 최고점수 / 일시정지 / 음소거 -->
    <div id="footer">
      <span>🏆 최고 점수: <span id="best">0</span></span>
      <div>
        <button id="pauseBtn">⏸️</button>
        <button id="muteBtn">🔊</button>
      </div>
    </div>
  </div>

  <!-- 👇 속도 UP 알림을 띄울 요소 -->
  <div id="speedAlert">⚡ 속도 UP!</div>

  <!-- 시작/결과 화면 오버레이 -->
  <div id="overlay">
    <div id="panel">
      <h1>🌾 농장 지키기 🐹</h1>
      <p>두더지가 농작물을 망치기 전에 잡아주세요!</p>
      <ul>
        <li>🎯 <b>성공</b>: 두더지 20마리 잡기</li>
        <li>❌ <b>실패</b>: 놓친 두더지 5마리</li>
        <li>🖱️ <b>조작</b>: 두더지를 클릭</li>
        <li>🔥 5마리 연속 잡으면 콤보 보너스!</li>
        <li>⚡ 5마리 잡을 때마다 점점 빨라져요!</li>
      </ul>
      
      <div id="btnGroup">
        <!-- '이어서 하기' 버튼 (처음엔 숨김 처리) -->
        <button id="continueBtn" class="btn-resume" style="display: none;">이어서 하기</button>
        <button id="startBtn" class="btn-restart">게임 시작</button>
      </div>
    </div>
  </div>

  <!-- 👇 일시정지 오버레이 -->
  <div id="pauseOverlay" class="hidden">
    <div id="pausePanel">
      <h2>⏸️ 일시정지</h2>
      <p>잠시 쉬어가세요!</p>
      <div class="btn-group">
        <button id="resumeBtn" class="btn-resume">이어서 하기</button>
        <button id="restartBtn" class="btn-restart">처음부터</button>
      </div>
    </div>
  </div>

  <!-- 게임 로직 -->
  <script src="game.js"></script>
</body>
</html>
