<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐸 개구리 리듬 건너기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Malgun Gothic', sans-serif;
    background: #1a1a2e; color: #eee;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 12px; overflow-x: hidden;
  }
  h1 { font-size: 22px; margin-bottom: 8px; color: #7cfc00; text-align: center; }
  .info { font-size: 13px; color: #aaa; text-align: center; margin-bottom: 10px; line-height: 1.5; max-width: 480px; }
  .info b { color: #7cfc00; }
  
  .status-bar { display: flex; gap: 10px; margin-bottom: 10px; font-size: 14px; flex-wrap: wrap; justify-content: center; }
  .status-bar span { background: #16213e; padding: 6px 14px; border-radius: 20px; border: 1px solid #0f3460; }
  .status-bar .highlight { color: #ffd700; font-weight: bold; }

  #gameWrap { position: relative; width: 100%; max-width: 480px; }
  
  #game {
    position: relative; width: 100%; 
    background: #1e1e2e; border-radius: 10px; overflow: hidden;
    border: 3px solid #0f3460;
  }

  #game.shake { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  .row {
    position: relative;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: background 0.2s, box-shadow 0.2s;
  }

  .row.grass { background: #2e7d32; }
  .row.road { background: #2a2a3a; }

  /* ⭐️ 랜덤하게 빛나는 도로 타일 */
  .row.road.lit {
    background: #4caf50;
    box-shadow: 0 0 25px #7cfc00 inset, 0 0 15px #7cfc00;
    animation: tilePulse 0.3s infinite alternate;
  }
  @keyframes tilePulse {
    from { background: #4caf50; }
    to { background: #7cfc00; }
  }

  /* ⭐️ 개구리가 빛나는 칸을 밟았을 때의 효과 */
  .row.road.scored {
    background: #ffd700 !important;
    box-shadow: 0 0 30px #ffd700 inset, 0 0 20px #ffd700 !important;
    transition: all 0.3s;
  }

  .goal-line {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: repeating-linear-gradient(
      90deg, #ffd700 0 10px, transparent 10px 20px
    );
  }

  .frog {
    position: absolute;
    font-size: 26px;
    line-height: 1;
    transition: left 0.08s, top 0.08s;
    z-index: 10;
    filter: drop-shadow(0 0 4px #7cfc00);
  }
  .frog.jump { transform: scale(1.15); }
  .frog.scoring { animation: frogScore 0.4s; }
  @keyframes frogScore {
    0% { transform: scale(1.15) rotate(0deg); filter: drop-shadow(0 0 15px #ffd700); }
    50% { transform: scale(1.4) rotate(10deg); filter: drop-shadow(0 0 25px #ffd700); }
    100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 4px #7cfc00); }
  }

  .car {
    position: absolute;
    font-size: 24px;
    line-height: 1;
    z-index: 5;
    filter: drop-shadow(0 0 3px rgba(255,0,0,0.6));
  }

  /* 점수 획득 시 나타나는 +1 텍스트 */
  .score-pop {
    position: absolute;
    font-size: 20px;
    font-weight: bold;
    color: #ffd700;
    z-index: 20;
    pointer-events: none;
    animation: scorePop 0.7s ease-out forwards;
    text-shadow: 0 0 10px #ffd700;
  }
  @keyframes scorePop {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-40px) scale(1.5); }
  }

  #overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; z-index: 100; border-radius: 10px; text-align: center; padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay .result { font-size: 34px; font-weight: bold; }
  #overlay .result.win { color: #7cfc00; }
  #overlay .result.lose { color: #ff5252; }
  #overlay .sub { font-size: 14px; color: #ccc; line-height: 1.5; }

  .btn {
    background: #0f3460; color: #fff; border: 2px solid #7cfc00;
    padding: 10px 24px; border-radius: 8px; font-size: 15px;
    cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: #16498a; }

  .controls { margin-top: 12px; display: flex; gap: 10px; justify-content: center; }
  .toggle-btn {
    background: #16213e; border: 1px solid #0f3460; color: #ccc;
    padding: 8px 16px; border-radius: 8px; font-size: 13px;
    cursor: pointer; font-family: inherit;
  }
  .toggle-btn:hover { border-color: #7cfc00; }
  .toggle-btn.active { background: #0f3460; color: #7cfc00; border-color: #7cfc00; }
</style>
</head>
<body>

<h1>🐸 개구리 리듬 건너기</h1>
<div class="info">
  차를 피해서 <b>목표 점수</b>를 모으세요!<br>
  <b>랜덤으로 빛나는 도로 칸</b>에 개구리가 도착하면 <b>+1점</b>!
</div>

<div class="status-bar">
  <span>점수: <b class="highlight" id="progress">0</b> / 10</span>
  <span>최고: <b class="highlight" id="best">0</b> 점</span>
</div>

<div id="gameWrap">
  <div id="game"></div>
  <div id="overlay">
    <div class="result" id="resultText">준비!</div>
    <div class="sub" id="resultSub">방향키를 눌러 시작하세요</div>
    <!-- 처음에는 이 버튼이 숨겨져 있습니다 -->
    <button class="btn" id="restartBtn" style="display: none;">다시 시작</button>
  </div>
</div>

<div class="controls">
  <button class="toggle-btn" id="soundBtn">🔊 소리 끄기</button>
  <button class="toggle-btn" id="motionBtn">✨ 빛 줄이기</button>
</div>

<script>
/* ============================================================
   ⚙️ 설정값 (난이도 조절)
   ============================================================ */
const CONFIG = {
  CAR_SPEED: 2,        // 차 속도 (숫자가 클수록 어려움)
  CAR_INTERVAL: 900,   // 차가 새로 나오는 간격 (ms)
  GOAL: 10,            // 목표 점수 (10점)
  ROWS: 12,            // 전체 줄 수
  START_ROW: 11,       // 개구리 시작 줄 (맨 아래)
  BPM: 80,             // 도로 타일이 빛나는 박자 속도 (낮을수록 여유로움)
  LIGHT_DURATION: 1200 // 한 칸이 빛나는 시간 (ms) - 1.2초
};
/* ============================================================ */

const gameEl    = document.getElementById('game');
const overlay   = document.getElementById('overlay');
const resultText= document.getElementById('resultText');
const resultSub = document.getElementById('resultSub');
const restartBtn= document.getElementById('restartBtn');
const progressEl= document.getElementById('progress');
const bestEl    = document.getElementById('best');
const soundBtn  = document.getElementById('soundBtn');
const motionBtn = document.getElementById('motionBtn');

let state = {};
let cars = [];
let carSpawnTimer = null;
let beatTimer = null;
let rafId = null;
let lastTime = 0;
let beatDuration = 0;

// 빛나는 타일 관리
let litRows = new Set(); // 현재 빛나는 줄 번호들
let litTimers = new Map(); // 각 줄의 타이머

let soundOn = true;
let motionOn = true;
let audioCtx = null;

// --- 저장 ---
const STORAGE_KEY = 'frogRhythmRandomBest';
function loadBest() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return 0;
    const n = parseInt(raw, 10);
    return isFinite(n) && n > 0 ? n : 0;
  } catch (e) { return 0; }
}
function saveBest(value) {
  try { localStorage.setItem(STORAGE_KEY, String(value)); } catch (e) {}
}
let bestScore = loadBest();
bestEl.textContent = bestScore;

// --- 사운드 ---
function playSound(freq, duration, type='square') {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = freq; osc.type = type;
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start(); osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

// --- 화면 크기 ---
function getCellSize() {
  const wrapWidth = gameEl.clientWidth || 400;
  const cols = 6;
  const cellW = wrapWidth / cols;
  const cellH = Math.min(cellW, 44);
  return { cellW, cellH, cols };
}

// --- 게임판 그리기 ---
function buildBoard() {
  gameEl.innerHTML = '';
  const { cellH } = getCellSize();
  gameEl.style.height = (cellH * CONFIG.ROWS) + 'px';

  for (let r = 0; r < CONFIG.ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'row ' + (r === 0 || r === CONFIG.ROWS - 1 ? 'grass' : 'road');
    row.id = 'row-' + r;
    row.style.height = cellH + 'px';
    if (r === 0) {
      const gl = document.createElement('div');
      gl.className = 'goal-line';
      row.appendChild(gl);
    }
    gameEl.appendChild(row);
  }

  const frog = document.createElement('div');
  frog.className = 'frog';
  frog.id = 'frog';
  frog.textContent = '🐸';
  gameEl.appendChild(frog);
}

function updateFrog() {
  const frog = document.getElementById('frog');
  if (!frog) return;
  const { cellW, cellH, cols } = getCellSize();
  const centerX = (cols / 2) * cellW;
  frog.style.left = (centerX - cellW * 0.3) + 'px';
  frog.style.top  = (state.frogRow * cellH) + 'px';
  frog.style.fontSize = Math.min(cellH * 0.8, 26) + 'px';
}

// --- 랜덤하게 도로 칸 빛내기 ---
function lightRandomRow() {
  if (state.status !== 'playing') return;
  if (!motionOn) return;

  // ⭐️ 화면에 빛이 이미 1개 이상 켜져 있으면, 새로 켜지 않음!
  if (litRows.size >= 1) return; 

  const availableRows = [];
  for (let r = 1; r <= CONFIG.ROWS - 2; r++) {
    if (!litRows.has(r)) availableRows.push(r);
  }
  
  if (availableRows.length === 0) return;

  const rowNum = availableRows[Math.floor(Math.random() * availableRows.length)];
  const rowEl = document.getElementById('row-' + rowNum);
  if (!rowEl) return;

  // 불 켜기
  rowEl.classList.add('lit');
  litRows.add(rowNum);
  playSound(500 + rowNum * 20, 0.06, 'sine');

  // 일정 시간 후 자동으로 불 끄기
  const timer = setTimeout(() => {
    rowEl.classList.remove('lit');
    litRows.delete(rowNum);
    litTimers.delete(rowNum);
  }, CONFIG.LIGHT_DURATION);

  litTimers.set(rowNum, timer);
}

// --- 박자마다 랜덤 빛 발생 ---
function triggerBeat() {
  if (state.status !== 'playing') return;
  lightRandomRow();
}

// --- 점수 획득 효과 ---
function showScorePop(rowNum) {
  const { cellH } = getCellSize();
  const pop = document.createElement('div');
  pop.className = 'score-pop';
  pop.textContent = '+1';
  pop.style.left = '50%';
  pop.style.transform = 'translateX(-50%)';
  pop.style.top = (rowNum * cellH) + 'px';
  gameEl.appendChild(pop);
  setTimeout(() => pop.remove(), 700);
}

// --- 새 게임 (초기화) ---
function resetGame() {
  stopLoop();
  clearCars();

  state = {
    frogRow: CONFIG.START_ROW,
    progress: 0,
    status: 'ready'
  };
  cars = [];
  buildBoard();
  updateFrog();
  progressEl.textContent = '0';

  overlay.classList.remove('hidden');
  resultText.textContent = '준비!';
  resultText.className = 'result';
  resultSub.innerHTML = '방향키를 눌러 시작하세요<br><span style="font-size:13px">빛나는 칸에 도착하면 +1점</span>';
  
  // ⭐️ 준비 상태에서는 '다시 시작' 버튼을 숨깁니다.
  restartBtn.style.display = 'none';
  
  gameEl.classList.remove('shake');
}

// --- 게임 시작 ---
function startGame() {
  if (state.status !== 'ready') return;
  state.status = 'playing';
  overlay.classList.add('hidden');

  carSpawnTimer = setInterval(spawnCar, CONFIG.CAR_INTERVAL);
  spawnCar();

  beatDuration = 60000 / CONFIG.BPM;
  triggerBeat();
  beatTimer = setInterval(triggerBeat, beatDuration);

  lastTime = performance.now();
  rafId = requestAnimationFrame(loop);
}

// --- 차 생성 ---
function spawnCar() {
  if (state.status !== 'playing') return;
  const { cellW, cellH, cols } = getCellSize();

  const row = 1 + Math.floor(Math.random() * (CONFIG.ROWS - 2));
  const dir = Math.random() < 0.5 ? 1 : -1;

  const car = document.createElement('div');
  car.className = 'car';
  car.textContent = dir === 1 ? '🚗' : '🚙';
  car.style.fontSize = Math.min(cellH * 0.8, 24) + 'px';
  car.style.top = (row * cellH) + 'px';

  const startX = dir === 1 ? -cellW : gameEl.clientWidth + cellW;
  car.style.left = startX + 'px';
  gameEl.appendChild(car);

  cars.push({
    el: car,
    x: startX,
    row: row,
    dir: dir,
    cellW: cellW
  });
}

function clearCars() {
  if (carSpawnTimer) { clearInterval(carSpawnTimer); carSpawnTimer = null; }
  cars.forEach(c => c.el.remove());
  cars = [];
}

// --- 게임 루프 ---
function loop(now) {
  if (state.status !== 'playing') return;

  const dt = Math.min(now - lastTime, 100);
  lastTime = now;

  const width = gameEl.clientWidth;
  const { cellW, cols } = getCellSize();

  for (let i = cars.length - 1; i >= 0; i--) {
    const car = cars[i];
    car.x += car.dir * CONFIG.CAR_SPEED * (dt / 16);

    if ((car.dir === 1 && car.x > width + cellW) ||
        (car.dir === -1 && car.x < -cellW * 2)) {
      car.el.remove();
      cars.splice(i, 1);
      continue;
    }

    car.el.style.left = car.x + 'px';

    // 충돌
    if (state.status === 'playing' && car.row === state.frogRow) {
      const frogX = (cols / 2) * cellW - cellW * 0.3;
      const frogLeft = frogX;
      const frogRight = frogX + cellW * 0.6;
      const carLeft = car.x;
      const carRight = car.x + cellW * 0.6;

      if (frogRight > carLeft && frogLeft < carRight) {
        loseGame();
        return;
      }
    }
  }

  rafId = requestAnimationFrame(loop);
}

// --- 이동 (여기서 점수를 받음!) ---
function moveFrog(dx, dy) {
  if (state.status === 'ready') {
    startGame();      // ⭐️ 키보드를 누르면 게임 시작!
    return;
  }
  if (state.status !== 'playing') return;

  let newRow = state.frogRow + dy;

  if (newRow < 0) newRow = 0;
  if (newRow >= CONFIG.ROWS) newRow = CONFIG.ROWS - 1;

  const movedRow = dy !== 0;
  state.frogRow = newRow;

  const frog = document.getElementById('frog');
  if (frog) {
    frog.classList.add('jump');
    setTimeout(() => frog.classList.remove('jump'), 100);
  }
  updateFrog();

  // 이동 소리
  playSound(600, 0.05, 'sine');

  // ⭐️ 이동한 칸이 빛나고 있으면 점수 획득!
  if (movedRow) {
    const rowEl = document.getElementById('row-' + newRow);
    if (rowEl && rowEl.classList.contains('lit')) {
      // 점수 획득!
      state.progress += 1;
      progressEl.textContent = state.progress;
      
      // 점수 획득 효과
      showScorePop(newRow);
      playSound(880, 0.1, 'sine');
      setTimeout(() => playSound(1200, 0.1, 'sine'), 80);
      
      // 개구리 축하 모션
      if (frog) {
        frog.classList.add('scoring');
        setTimeout(() => frog.classList.remove('scoring'), 400);
      }
      
      // 빛나던 칸을 황금색으로 변경 (먹은 표시)
      rowEl.classList.remove('lit');
      litRows.delete(newRow);
      if (litTimers.has(newRow)) {
        clearTimeout(litTimers.get(newRow));
        litTimers.delete(newRow);
      }
      
      rowEl.classList.add('scored');
      setTimeout(() => rowEl.classList.remove('scored'), 500);
      
      // 승리 체크
      if (state.progress >= CONFIG.GOAL) {
        winGame();
        return;
      }
    }
  }

  checkCollision();
}

function checkCollision() {
  const { cellW, cols } = getCellSize();
  const frogX = (cols / 2) * cellW - cellW * 0.3;
  const frogLeft = frogX;
  const frogRight = frogX + cellW * 0.6;

  for (const car of cars) {
    if (car.row === state.frogRow) {
      const carLeft = car.x;
      const carRight = car.x + cellW * 0.6;
      if (frogRight > carLeft && frogLeft < carRight) {
        loseGame();
        return;
      }
    }
  }
}

// --- 승리 ---
function winGame() {
  state.status = 'win';
  stopLoop();

  if (state.progress > bestScore) {
    bestScore = state.progress;
    saveBest(bestScore);
    bestEl.textContent = bestScore;
  }

  playSound(880, 0.15);
  setTimeout(() => playSound(1100, 0.2), 150);
  setTimeout(() => playSound(1320, 0.25), 300);

  overlay.classList.remove('hidden');
  resultText.textContent = '🎉 성공!';
  resultText.className = 'result win';
  resultSub.innerHTML = `목표 점수 <b>${CONFIG.GOAL}점</b> 달성!<br>다시 도전해보세요`;
  
  // ⭐️ 게임이 끝나면 '다시 시작' 버튼을 보이게 합니다.
  restartBtn.style.display = 'inline-block';
}

// --- 패배 ---
function loseGame() {
  state.status = 'lose';
  stopLoop();

  if (state.progress > bestScore) {
    bestScore = state.progress;
    saveBest(bestScore);
    bestEl.textContent = bestScore;
  }

  playSound(200, 0.3, 'sawtooth');

  if (motionOn) {
    gameEl.classList.add('shake');
    setTimeout(() => gameEl.classList.remove('shake'), 400);
  }

  overlay.classList.remove('hidden');
  resultText.textContent = '💥 실패!';
  resultText.className = 'result lose';
  resultSub.innerHTML = `차에 부딪혔어요!<br>최종 점수: <b>${state.progress}점</b>`;
  
  // ⭐️ 게임이 끝나면 '다시 시작' 버튼을 보이게 합니다.
  restartBtn.style.display = 'inline-block';
}

// --- 루프 중지 ---
function stopLoop() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (carSpawnTimer) { clearInterval(carSpawnTimer); carSpawnTimer = null; }
  if (beatTimer) { clearInterval(beatTimer); beatTimer = null; }
  
  // 모든 빛 정리
  document.querySelectorAll('.row.lit').forEach(el => el.classList.remove('lit'));
  document.querySelectorAll('.row.scored').forEach(el => el.classList.remove('scored'));
  litRows.clear();
  litTimers.forEach(t => clearTimeout(t));
  litTimers.clear();
}

// --- 키 입력 ---
const keysDown = {};

document.addEventListener('keydown', (e) => {
  const key = e.key.toLowerCase();
  if (e.repeat) return;
  if (keysDown[key]) return;
  keysDown[key] = true;

  let handled = true;
  if (key === 'arrowup' || key === 'w')        moveFrog(0, -1);
  else if (key === 'arrowdown' || key === 's')  moveFrog(0, 1);
  else if (key === 'arrowleft' || key === 'a')  moveFrog(-1, 0);
  else if (key === 'arrowright' || key === 'd') moveFrog(1, 0);
  else handled = false;

  if (handled) e.preventDefault();
});

document.addEventListener('keyup', (e) => {
  keysDown[e.key.toLowerCase()] = false;
});

// --- 포커스 이탈 ---
let wasPlayingBeforeBlur = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state.status === 'playing') { wasPlayingBeforeBlur = true; stopLoop(); }
  } else {
    if (wasPlayingBeforeBlur && state.status === 'playing') {
      wasPlayingBeforeBlur = false;
      lastTime = performance.now();
      if (!carSpawnTimer) carSpawnTimer = setInterval(spawnCar, CONFIG.CAR_INTERVAL);
      if (!beatTimer) beatTimer = setInterval(triggerBeat, beatDuration);
      rafId = requestAnimationFrame(loop);
    }
  }
});
window.addEventListener('blur', () => {
  if (state.status === 'playing') { stopLoop(); wasPlayingBeforeBlur = true; }
});
window.addEventListener('focus', () => {
  if (wasPlayingBeforeBlur && state.status === 'playing') {
    wasPlayingBeforeBlur = false;
    lastTime = performance.now();
    if (!carSpawnTimer) carSpawnTimer = setInterval(spawnCar, CONFIG.CAR_INTERVAL);
    if (!beatTimer) beatTimer = setInterval(triggerBeat, beatDuration);
    rafId = requestAnimationFrame(loop);
  }
});

// --- 창 크기 변경 ---
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    buildBoard();
    updateFrog();
    progressEl.textContent = state.progress;
  }, 150);
});

// --- 다시 시작 버튼 클릭 ---
restartBtn.addEventListener('click', () => {
  resetGame(); // 판 초기화 및 준비 화면으로 이동 (버튼은 자동으로 다시 숨겨짐)
});

// --- 효과 버튼 ---
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  soundBtn.textContent = soundOn ? '🔊 소리 끄기' : '🔇 소리 켜기';
  soundBtn.classList.toggle('active', !soundOn);
});

motionBtn.addEventListener('click', () => {
  motionOn = !motionOn;
  motionBtn.textContent = motionOn ? '✨ 빛 줄이기' : '🌙 빛 켜기';
  motionBtn.classList.toggle('active', !motionOn);
  
  if (!motionOn) {
    document.querySelectorAll('.row.lit').forEach(el => el.classList.remove('lit'));
    litRows.clear();
    litTimers.forEach(t => clearTimeout(t));
    litTimers.clear();
    gameEl.classList.remove('shake');
  }
});




// --- 초기 실행 ---
resetGame();
window.addEventListener('load', updateFrog);
</script>

</body>
</html>
